name: build
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions: {}
# Tags are the APK's exact versionName and titles start with the app name, so Obtainium
# can track each app here with a title filter and "fallback to older releases".
jobs:
  keepalive:
    # Public repos stop scheduled runs after 60 idle days; re-enabling resets that.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/enable"

  f1tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download -R Alexvbp/f1tv-4k-patch -p '*.apkm' -O in.apkm
          unzip -q in.apkm -d in
          aapt2=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          ver=$("$aapt2" dump badging in/base.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          [[ $ver =~ ^[0-9][0-9A-Za-z._-]*$ ]]
          gh release view "$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          # Obtainium installs the file named after the app id first, so only the base may carry it.
          # Splits fixed to one 32-bit, English, xhdpi TV.
          mkdir out
          cp in/base.apk out/com.formulaone.production.apk
          for s in armeabi_v7a en xhdpi; do cp "in/com.formulaone.production.config.$s.apk" "out/split_$s.apk"; done
          (cd out && zip -q -0 ../f1tv.apkm ./*.apk)
          gh release create "$ver" f1tv.apkm -R "$GITHUB_REPOSITORY" --title "F1 TV $ver" --notes ""

  launcher-build:
    # Runs upstream's Gradle code, so it never sees a write token or the signing key.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.check.outputs.ver }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view -R Gathin23/cleanyourtv --json tagName -q .tagName)
          git clone -q --depth 1 --branch "$tag" https://github.com/Gathin23/cleanyourtv src
          ver=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" src/launcher/app/build.gradle)
          [[ $ver =~ ^[0-9][0-9A-Za-z._-]*$ ]]
          gh release view "$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ver
        working-directory: src/launcher
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew assembleRelease -q --console=plain
      - if: steps.check.outputs.ver
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: src/launcher/app/build/outputs/apk/release/app-release.apk

  launcher-release:
    needs: launcher-build
    if: needs.launcher-build.outputs.ver
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
      - env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          VER: ${{ needs.launcher-build.outputs.ver }}
          TAG: ${{ needs.launcher-build.outputs.tag }}
        run: |
          set -euo pipefail
          [[ $VER =~ ^[0-9][0-9A-Za-z._-]*$ ]]
          # A fixed key keeps updates installable; upstream signs with whatever debug key the builder has.
          base64 -d <<<"$KEYSTORE" > ks.p12
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks ks.p12 --ks-pass pass:android --out cleanyourtv.apk app-release.apk
          gh release create "$VER" cleanyourtv.apk -R "$GITHUB_REPOSITORY" --title "CleanYourTV $VER" --notes "Upstream $TAG"
